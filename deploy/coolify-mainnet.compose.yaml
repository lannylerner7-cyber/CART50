# NEW resource only. Never replace or attach the Signet wallet volumes.
# Repository root is the Coolify --project-directory.
# REQUIRED: enable Raw Compose Deployment in Coolify.
# Local-driver bind volumes avoid Coolify creating missing host bind directories.
services:
  bitcoin-mainnet:
    build:
      context: .
      dockerfile: deploy/bitcoin-mainnet.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    labels:
      - traefik.enable=false
    volumes:
      - mainnet-encrypted-bitcoin:/var/lib/bitcoin
      - mainnet-encrypted-cookie:/run/bitcoin
    networks: [mainnet-rpc, mainnet-egress]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -conf=/etc/bitcoin/bitcoin.conf getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  vault-mainnet-engine:
    build:
      context: .
      dockerfile: deploy/vault-engine.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    labels:
      - traefik.enable=false
    depends_on:
      bitcoin-mainnet:
        condition: service_healthy
    environment:
      BITCOIN_NETWORK: main
      ALLOW_MAINNET: ${ALLOW_MAINNET:?Explicit operator approval required}
      VAULT_CUSTODY_MODE: server
      ENGINE_LISTEN: 0.0.0.0:9090
      ENGINE_DATA_DIR: /var/lib/personal-vault
      VAULT_ENGINE_TOKEN: ${MAINNET_ENGINE_TOKEN:?Use a separate mainnet service token}
      BTC_RPC_URL: http://bitcoin-mainnet:8332
      BTC_RPC_COOKIE_FILE: /run/bitcoin/.cookie
    volumes:
      - mainnet-encrypted-signer:/var/lib/personal-vault
      - mainnet-encrypted-cookie:/run/bitcoin:ro
    networks: [mainnet-rpc, app-network]
volumes:
  mainnet-encrypted-bitcoin:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/vault-mainnet/bitcoin
  mainnet-encrypted-cookie:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/vault-mainnet/cookie
  mainnet-encrypted-signer:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/vault-mainnet/signer
networks:
  mainnet-rpc:
    internal: true
  mainnet-egress:
  app-network:
    external: true
    name: ${COOLIFY_NETWORK:?}
