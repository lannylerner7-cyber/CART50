# NEW resource only. Never replace or attach the Signet wallet volumes.
# Repository root is the Coolify --project-directory.
services:
  bitcoin-mainnet:
    build:
      context: .
      dockerfile: deploy/bitcoin-mainnet.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    labels:
      traefik.enable: "false"
    volumes:
      - type: bind
        source: /mnt/vault-mainnet/bitcoin
        target: /var/lib/bitcoin
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/vault-mainnet/cookie
        target: /run/bitcoin
        bind:
          create_host_path: false
    networks: [mainnet-rpc, mainnet-egress]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -conf=/etc/bitcoin/bitcoin.conf getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  vault-mainnet-engine:
    build:
      context: .
      dockerfile: deploy/vault-engine.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    labels:
      traefik.enable: "false"
    depends_on:
      bitcoin-mainnet:
        condition: service_healthy
    environment:
      BITCOIN_NETWORK: main
      ALLOW_MAINNET: ${ALLOW_MAINNET:?Explicit operator approval required}
      VAULT_CUSTODY_MODE: server
      ENGINE_LISTEN: 0.0.0.0:9090
      ENGINE_DATA_DIR: /var/lib/personal-vault
      VAULT_ENGINE_TOKEN: ${MAINNET_ENGINE_TOKEN:?Use a separate mainnet service token}
      BTC_RPC_URL: http://bitcoin-mainnet:8332
      BTC_RPC_COOKIE_FILE: /run/bitcoin/.cookie
    volumes:
      - type: bind
        source: /mnt/vault-mainnet/signer
        target: /var/lib/personal-vault
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/vault-mainnet/cookie
        target: /run/bitcoin
        read_only: true
        bind:
          create_host_path: false
    networks: [mainnet-rpc, app-network]
networks:
  mainnet-rpc:
    internal: true
  mainnet-egress:
  app-network:
    external: true
    name: ${COOLIFY_NETWORK:?}
