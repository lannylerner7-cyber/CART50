# Private mainnet node. Separate data/cookie volumes from the Signet stack.
chain=main
server=1
datadir=/var/lib/bitcoin
rpccookiefile=/run/bitcoin/.cookie
prune=10240
dbcache=256
maxconnections=16
listen=0
printtoconsole=1
rpcbind=0.0.0.0
rpcport=8332
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
