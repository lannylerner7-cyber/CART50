# Test coins only. No inbound P2P and no public RPC port.
signet=1
server=1
datadir=/var/lib/bitcoin
rpccookiefile=/run/bitcoin/.cookie
prune=2048
dbcache=256
maxconnections=16
listen=0
printtoconsole=1

[signet]
rpcbind=0.0.0.0
rpcport=38332
# Cookie authentication is still required. The compose stack publishes no ports.
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
