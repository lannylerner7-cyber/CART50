  "components": {
    "schemas": {
      "SandboxSignetStatus": {
        "type": "object",
        "required": ["available", "network", "message", "wallet", "node", "transactions"],
        "properties": {
          "available": { "type": "boolean" },
          "network": { "type": "string", "enum": ["signet"] },
          "message": { "type": "string" },
          "wallet": { "anyOf": [{ "$ref": "#/components/schemas/Wallet" }, { "type": "null" }] },
          "node": { "anyOf": [{ "$ref": "#/components/schemas/NodeStatus" }, { "type": "null" }] },
          "transactions": { "type": "array", "items": { "$ref": "#/components/schemas/Transaction" } }
        }
      },
      "SandboxSignetInput": {
        "type": "object",
        "required": ["address", "amountSats", "feeRate"],
        "properties": {
          "address": { "type": "string", "minLength": 14, "maxLength": 100 },
          "amountSats": { "type": "string", "pattern": "^[0-9]{1,16}$" },
          "feeRate": { "type": "string", "pattern": "^[0-9]{1,5}(\\.[0-9]{1,3})?$" }
        }
      },
      "HealthStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "Ok": {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "ok",
          "message"
        ]
      },
      "Session": {
        "type": "object",
        "properties": {
          "loginRetryAfterSeconds": {
            "type": "integer",
            "minimum": 0,
            "description": "Server-authoritative login cooldown remaining; absent on successful login."
          },
          "authenticated": {
            "type": "boolean"
          },
          "configured": {
            "type": "boolean"
          },
          "csrfToken": {
            "type": [
              "string",
              "null"
            ]
          },
          "expiresAt": {
            "type": [
              "string",
              "null"
            ]
          },
          "network": {
            "type": "string"
          }
        },
        "required": [
          "authenticated",
          "configured",
          "csrfToken",
          "expiresAt",
          "network"
        ]
      },
      "CredentialInput": {
        "type": "object",
        "properties": {
          "credential": {
            "type": "string",
            "minLength": 86,
            "maxLength": 86
          }
        },
        "required": [
          "credential"
        ]
      },
      "RotationInput": {
        "type": "object",
        "properties": {
          "credential": {
            "type": "string"
          },
          "newCredential": {
            "type": "string"
          }
        },
        "required": [
          "credential",
          "newCredential"
        ]
      },
      "Wallet": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string"
          },
          "address": {
            "type": [
              "string",
              "null"
            ]
          },
          "kind": {
            "type": "string",
            "enum": [
              "temporary",
              "cold",
              "reserve",
              "spending"
            ]
          },
          "createdAt": {
            "type": "string"
          },
          "expiresAt": {
            "type": [
              "string",
              "null"
            ]
          },
          "status": {
            "type": "string"
          },
          "destructionStatus": {
            "type": "string"
          },
          "confirmedSats": {
            "type": "string"
          },
          "unconfirmedSats": {
            "type": "string"
          },
          "availableSats": {
            "type": "string"
          },
          "totalReceivedSats": {
            "type": "string"
          },
          "totalSweptSats": {
            "type": "string"
          },
          "lastSync": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "id",
          "label",
          "address",
          "kind",
          "createdAt",
          "expiresAt",
          "status",
          "destructionStatus",
          "confirmedSats",
          "unconfirmedSats",
          "availableSats",
          "totalReceivedSats",
          "totalSweptSats",
          "lastSync"
        ]
      },
      "WalletInput": {
        "type": "object",
        "properties": {
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200
          }
        },
        "required": [
          "label",
          "count"
        ]
      },
      "WalletUpdate": {
        "type": "object",
        "properties": {
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          }
        },
        "required": [
          "label"
        ]
      },
      "Transaction": {
        "type": "object",
        "properties": {
          "txid": {
            "type": "string"
          },
          "walletId": {
            "type": "string"
          },
          "direction": {
            "type": "string"
          },
          "amountSats": {
            "type": "string"
          },
          "feeSats": {
            "type": [
              "string",
              "null"
            ]
          },
          "firstSeen": {
            "type": "string"
          },
          "confirmations": {
            "type": "integer"
          },
          "status": {
            "type": "string"
          },
          "address": {
            "type": [
              "string",
              "null"
            ]
          },
          "replacedBy": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "txid",
          "walletId",
          "direction",
          "amountSats",
          "feeSats",
          "firstSeen",
          "confirmations",
          "status",
          "address",
          "replacedBy"
        ]
      },
      "NodeSync": {
        "type": "object",
        "required": ["available", "message", "network", "observedAt", "blocks", "headers", "verificationProgress", "initialBlockDownload"],
        "properties": {
          "available": {"type": "boolean"},
          "message": {"type": "string"},
          "network": {"type": "string"},
          "observedAt": {"type": ["string", "null"]},
          "blocks": {"type": ["integer", "null"]},
          "headers": {"type": ["integer", "null"]},
          "verificationProgress": {"type": ["number", "null"]},
          "initialBlockDownload": {"type": ["boolean", "null"]}
        }
      },
      "NodeStatus": {
        "type": "object",
        "properties": {
          "connected": {
            "type": "boolean"
          },
          "network": {
            "type": "string"
          },
          "blocks": {
            "type": [
              "integer",
              "null"
            ]
          },
          "headers": {
            "type": [
              "integer",
              "null"
            ]
          },
          "syncProgress": {
            "type": [
              "number",
              "null"
            ]
          },
