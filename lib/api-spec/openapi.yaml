    "/vault/sandbox/signet": {
      "get": {
        "operationId": "getSandboxSignet",
        "responses": { "200": { "description": "Isolated Signet readiness and assigned wallet", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxSignetStatus" } } } } }
      }
    },
    "/vault/sandbox/signet/reviews": {
      "post": {
        "operationId": "reviewSandboxSignetPayment",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxSignetInput" } } } },
        "responses": { "200": { "description": "Session-bound Signet review", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PaymentReview" } } } } }
      }
    },
    "/vault/sandbox/signet/payments": {
      "post": {
        "operationId": "sendSandboxSignetPayment",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PaymentApproval" } } } },
        "responses": { "200": { "description": "Actual Signet transaction, not real BTC", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Transaction" } } } } }
      }
    },
    "/vault/sandbox/address": {
      "get": {
        "operationId": "getSandboxAddress",
        "parameters": [
          { "name": "destination", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 128 } }
        ],
        "responses": {
          "200": { "description": "Assigned simulation ledger lookup, not blockchain data", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxAddressInfo" } } } }
        }
      }
    },
    "/vault/sandbox": {
      "get": {
        "operationId": "getSandbox",
        "responses": {
          "200": { "description": "Isolated simulation state, not real funds", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxSnapshot" } } } }
        }
      }
    },
    "/vault/sandbox/reviews": {
      "post": {
        "operationId": "reviewSandboxPayment",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxReviewInput" } } } },
        "responses": {
          "200": { "description": "Review requiring explicit approval", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxReview" } } } }
        }
      }
    },
    "/vault/sandbox/payments": {
      "post": {
        "operationId": "executeSandboxPayment",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxExecuteInput" } } } },
        "responses": {
          "200": { "description": "Idempotent simulation receipt; never a blockchain transaction", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SandboxReceipt" } } } }
        }
      }
    },
