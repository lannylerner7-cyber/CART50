          "environment": { "type": "string", "enum": ["simulation"] },
          "simulatedCreditCents": { "type": "integer" },
          "transactionCount": { "type": "integer" },
          "transactions": { "type": "array", "items": { "$ref": "#/components/schemas/SandboxReceipt" } },
          "checkedAt": { "type": "string" }
        }
      },
      "SandboxReviewInput": {
        "type": "object",
        "required": ["amountCents", "destination"],
        "properties": {
          "amountCents": { "type": "integer", "minimum": 1, "maximum": 300000 },
          "destination": { "type": "string", "maxLength": 128 }
        }
      },
      "SandboxExecuteInput": {
        "type": "object",
        "required": ["reviewId", "confirmed"],
        "properties": {
          "reviewId": { "type": "string", "maxLength": 128 },
          "confirmed": { "type": "boolean" }
        }
      },
      "SandboxReview": {
        "type": "object",
        "required": ["id", "amountCents", "destination", "createdAt", "expiresAt", "status", "receiptId"],
        "properties": {
          "id": { "type": "string" },
          "amountCents": { "type": "integer" },
          "destination": { "type": "string" },
          "createdAt": { "type": "string" },
          "expiresAt": { "type": "string" },
          "status": { "type": "string", "enum": ["pending", "complete"] },
          "receiptId": { "type": ["string", "null"] }
        }
      },
      "SandboxSnapshot": {
        "type": "object",
        "required": ["environment", "simulatedCreditCents", "assignedAddress", "signetAvailable", "message", "transactions", "reviews"],
        "properties": {
          "environment": { "type": "string", "enum": ["sandbox"] },
          "simulatedCreditCents": { "type": "integer" },
          "assignedAddress": { "type": ["string", "null"] },
          "signetAvailable": { "type": "boolean", "enum": [false] },
          "message": { "type": "string" },
          "transactions": { "type": "array", "items": { "$ref": "#/components/schemas/SandboxReceipt" } },
          "reviews": { "type": "array", "items": { "$ref": "#/components/schemas/SandboxReview" } }
        }
      },
      "WebAuthnInput": {
        "type": "object",
        "properties": {
          "response": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "response"
        ]
      }
    }
  }
}
